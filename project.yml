name: GameEdge
options:
  bundleIdPrefix: dev.igol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 884UZN5CH3
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: --timestamp
    DEAD_CODE_STRIPPING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

targets:
  GameEdge:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.igol.GameEdge
        PRODUCT_NAME: GameEdge
        PRODUCT_MODULE_NAME: GameEdge
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/GameEdge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SPARKLE_FEED_URL: https://github.com/IGOLz/GameEdge/releases/latest/download/appcast.xml
      configs:
        # Debug builds are a separate app, "GameEdge Dev": own bundle ID,
        # preferences and login item, DEV icon, no self-updates.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.igol.GameEdge.Dev
          PRODUCT_NAME: GameEdge Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          ONLY_ACTIVE_ARCH: YES
        Release:
          # Notarization rejects the debugger entitlement.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: Sparkle
      - sdk: ServiceManagement.framework
